<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob: file: http: https:;">
    <title>Quick Switcher</title>
        <link rel="stylesheet" href="qs.bundle.css">
</head>
<body>
    <div id="quickSwitcherApp" class="qs-overlay" role="dialog" aria-modal="true" aria-label="Switch account">

        <div class="qs-search-zone qs-bar">
            <div class="qs-title-line qs-bar-top">
                <span class="qs-title-text qs-bar-label">Quick Switch</span>
                <span class="qs-hotkey-hint qs-bar-shortcut" id="qsHotkeyHint">Ctrl+Alt+B</span>
            </div>
            <div class="qs-mode-tabs" role="tablist" aria-label="Quick switch mode">
                <button class="qs-mode-tab is-active" id="qsModeAccounts" data-mode="accounts" type="button" role="tab" aria-selected="true">Accounts</button>
                <button class="qs-mode-tab" id="qsModeGames" data-mode="games" type="button" role="tab" aria-selected="false">Games</button>
            </div>
            <div class="qs-searchbar qs-bar-search">
                <svg class="qs-search-icon qs-bar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input
                    type="text"
                    id="quickSwitcherSearch"
                    class="qs-search-input qs-bar-input"
                    placeholder="Search accounts or platforms..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search accounts"
                >
            </div>
            <div id="qsPlatformFilters" class="qs-platform-filters" role="group" aria-label="Filter by platform"></div>
        </div>

        <div class="qs-carousel-wrapper">
            <button class="qs-nav qs-nav-left" id="qsNavLeft" type="button" aria-label="Previous account" tabindex="-1">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>

            <div id="quickSwitcherList" class="qs-carousel qs-deck-results" role="listbox" aria-label="Accounts">
                <div class="qs-loading">
                    <div class="qs-spinner"></div>
                    <span>Loading accounts…</span>
                </div>
            </div>

            <button class="qs-nav qs-nav-right" id="qsNavRight" type="button" aria-label="Next account" tabindex="-1">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </div>

        <div id="qsSwitchStatus" class="qs-switch-status" aria-live="polite" aria-atomic="true"></div>

        <p id="quickSwitcherError" class="qs-error qs-error-bar" role="alert" aria-live="polite"></p>

        <div class="qs-deck-hints">Arrows choose &nbsp;·&nbsp; Enter select &nbsp;·&nbsp; Backspace back &nbsp;·&nbsp; Esc close</div>

        <button id="quickSwitcherClose" class="qs-close" type="button" title="Close (Esc)" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="1" y1="1" x2="11" y2="11"/>
                <line x1="11" y1="1" x2="1" y2="11"/>
            </svg>
        </button>

    </div>
        <script src="qs.bundle.js"></script>
</body>
</html>
